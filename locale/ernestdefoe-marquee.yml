ernestdefoe-marquee:
  admin:
    language_help: 'Keel, milles näidatakse filmide ja telesarjade pealkirju, sisukokkuvõtteid ja žanre – koodina, näiteks `fr`, `fr-FR` või `pt-BR`. Jäta väli tühjaks, et kasutada foorumi vaikekeelt. IGDB mänguandmed on ingliskeelsed (lisaks on olemas vaid jaapani- ja koreakeelsed nimed), mistõttu võetakse mängude kirjeldused selles keeles Wikipediast, kui mäng on seal olemas, ning ülejäänu tõlgitakse, kui lisad DeepL-i API-võtme; albumite andmed on artistide enda määratud keeles ning raamatute pealkirjad, kaanepildid ja kirjastajad järgivad seda keelt juhul, kui Open Librarys leidub selles keeles väljaanne (raamatute kirjeldused on enamasti ingliskeelsed). Juba lingitud teosed vahetavad keelt järgmisel värskendamisel.'
