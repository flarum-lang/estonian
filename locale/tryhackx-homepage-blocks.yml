    whitelist:
      describe_all_help: 'Käib läbi iga teema avapostituse, mida valitud sihtrühm näeb, registreerib esmalt selle magnetlingid ja saadab seejärel uuesti selle kirjelduse – üks päring paketi kohta, jätkatav, nagu kogu foorumi skannimisel. Tekstid, mis on träkkeris juba olemas, tagastatakse muutumatutena ja neid üle ei kirjutata; uued või muudetud tekstid luuakse, uuendatakse või pannakse järjekorda vastavalt selle API-võtme seadistustele träkkeris. Varem saadetud teemad, mida sihtrühm enam ei näe (peidetud, privaatsed või sildi all, mida nad ei näe), võetakse tagasi ning kustutatud teemad vabastatakse. Toiming püsib träkkeri päringulimiidi piires ja ootab ise, kui träkker palub tempot aeglustada; teema, millega träkkeril tekib tõrge, jääb kogu käivituse peatamise asemel järjekorda ootele. Nõuab, et valge nimekirja sünkroonimine ja valik „Saada teemade kirjeldused träkkerisse“ oleksid sisse lülitatud.'
      describe_help: 'Vaikimisi välja lülitatud. Kui teema avapostituse magnetlingid on sünkroonitud, saadetakse selle postituse tekst (täpselt nii, nagu autor selle sisestas), autor, link ja viimase muutmise aeg träkkerisse, mis kasutab seda nende torrentite kirjeldusena – olenevalt selle API-võtme seadistustest träkkeris kas moderaatoritele ülevaatamiseks suunatuna või kohe avaldatuna. Träkker kuvab seda, mida külaline foorumis näeb: teema, mida külaline ei näe (avapostitus või vestlus on peidetud või kustutatud, privaatne, liigutatud sildi alla, mida külalised ei näe, või ootab kinnitamist), võetakse träkkerist tagasi ja saadetakse uuesti, kui külaline seda jälle näeb; avapostitusest välja toimetatud räsi ja kustutatud vestlus vabastatakse träkkeris. Vastuseid ei saadeta kunagi. Iga muudatus ootab järjekorras ja seda saadetakse uuesti, kuni träkker selle vastu võtab. Kaasa saadetakse ka foorumi enda sisupikkuse piirang (sisu seadetest või tuuma 63 000 tähemärki, kui see piirang on välja lülitatud); sellest pikem postitus saadetakse ilma tekstita. Nõuab versiooni tryhackx-tracker 1.78.0 või uuemat, kus selle võtme jaoks on sisse lülitatud valik „Kirjeldused foorumist“ (tagasivõtmine nõuab versiooni 1.81.0). Kogu foorumi skannimine saadab ja värskendab samuti kirjeldusi.'
